spring:
  application:
    name: ifs25042-p5-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: false
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: false
  web:
    resources:
      cache:
        period: 31536000
        cachecontrol:
          max-age: 365d
          cache-public: true
          immutable: true

server:
  port: ${APP_PORT:${PORT:8080}}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/wasm

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  productionMode: true
  liveReload:
    enabled: false
