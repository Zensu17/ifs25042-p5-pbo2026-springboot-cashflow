<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Kelola pemasukan, pengeluaran, dan saldo cashflow Anda." />
  <title>Cashflow</title>
  <link rel="preload" as="style" href="/styles.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/styles.css" /></noscript>
  <style>
    html, body, #outlet {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    @supports (-webkit-touch-callout: none) {
      @media (display-mode: standalone) {
        html {
          height: 100lvh;
        }
      }
    }
  </style>
  <script>
    (function() {
      function mark() {
        var el = document.querySelector('vaadin-connection-indicator');
        if (el) {
          el.setAttribute('aria-hidden', 'true');
          return true;
        }
        return false;
      }
      if (!mark()) {
        var obs = new MutationObserver(function() {
          if (mark()) {
            obs.disconnect();
          }
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
</head>
<body>
  <div id="outlet">
    <main role="main" style="display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; background: #F3F4F6; box-sizing: border-box; padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
      <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); box-sizing: border-box; text-align: left;">
        <h1 style="margin: 0; font-size: 1.85rem; font-weight: 700; color: #111827; line-height: 1.2;">Cashflow</h1>
        <p style="margin: 0.35rem 0 0 0; color: #4B5563; font-size: 0.95rem; line-height: 1.4;">Kelola pemasukan, pengeluaran, dan saldo cashflow Anda.</p>
      </div>
    </main>
  </div>
</body>
</html>
