<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Kelola pemasukan, pengeluaran, dan saldo cashflow Anda." />
  <title>Cashflow</title>
  <link rel="preload" as="style" href="/styles.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/styles.css" /></noscript>
  <style>
    html, body, #outlet {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    @supports (-webkit-touch-callout: none) {
      @media (display-mode: standalone) {
        html {
          height: 100lvh;
        }
      }
    }
  </style>
  <script>
    (function() {
      function mark() {
        var el = document.querySelector('vaadin-connection-indicator');
        if (el) {
          el.setAttribute('aria-hidden', 'true');
          return true;
        }
        return false;
      }
      if (!mark()) {
        var obs = new MutationObserver(function() {
          if (mark()) {
            obs.disconnect();
          }
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
</head>
<body>
  <div id="outlet">
    <main role="main">
      <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Cashflow</h1>
    </main>
  </div>
</body>
</html>
